[tool.poetry]
name = "ai-market-intel"
version = "1.0.0"
description = "AI-powered market intelligence platform for mobile app analytics"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = ">=2.0.0"
requests = ">=2.31.0"
rapidfuzz = ">=3.0.0"
streamlit = ">=1.28.0"
kaggle = ">=1.5.16"
openai = ">=1.0.0"
google-generativeai = ">=0.3.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
plotly = ">=5.15.0"
reportlab = ">=4.0.0"
python-dotenv = ">=1.0.0"
pyarrow = ">=12.0.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
openpyxl = "^3.1.0"
kagglehub = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"
ipython = "^8.14.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ai-market-intel = "src.cli:main"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
